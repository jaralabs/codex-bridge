name: Publish to npm

# Publishes the package to npm whenever a push lands on main, but only
# when the version in package.json actually changed since the last
# published commit. Pull requests get a dry-run so we can see the
# publish output without uploading anything.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci || npm install

      - name: Type-check the plugin
        run: npx --yes -p typescript@5 tsc --noEmit --target es2022 --module esnext --moduleResolution bundler --strict --skipLibCheck --types node lib/plugin.ts

      - name: Smoke test the package builds
        run: node --check lib/server.mjs && node --check lib/tools-registry.mjs

      - name: Dry-run on pull requests
        if: github.event_name == 'pull_request'
        run: npm publish --dry-run --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish on main when the version moved
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: publish
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view "$PACKAGE_NAME" version 2>/dev/null || echo "0.0.0")
          echo "current=$CURRENT_VERSION published=$PUBLISHED_VERSION"
          if [ "$CURRENT_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "::notice::Version unchanged; skipping publish."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
