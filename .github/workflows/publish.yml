name: Publish to npm

# Publishes the package to npm whenever a push lands on main, but only
# when the version in package.json actually changed since the last
# published commit. Pull requests get a dry-run so we can see the
# publish output without uploading anything.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily live smoke against the real ChatGPT API. We keep this in
    # the same workflow so the smoke failure is co-located with the
    # publish path; it runs at 06:00 UTC and does NOT publish.
    - cron: "0 6 * * *"

jobs:
  test:
    # Run the test suite on the three Node majors we support. Catches
    # regressions where a new Node release changes fetch semantics,
    # AbortSignal handling, or anything else the bridge depends on.
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "24"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci || npm install

      - name: Type-check the plugin
        run: npx --yes -p typescript@5 tsc --noEmit --target es2022 --module esnext --moduleResolution bundler --strict --skipLibCheck --types node lib/plugin.ts

      - name: Smoke check the package builds
        run: |
          for f in lib/server.mjs lib/auth.mjs lib/resilience.mjs lib/capabilities.mjs lib/tools-registry.mjs lib/reasoning.mjs; do
            node --check "$f"
          done

      - name: Run resilience unit tests
        run: npm run test:resilience

      - name: Run reasoning-mapping unit tests
        run: npm run test:reasoning

      - name: Run tool-call tests
        run: |
          # These need a live bridge plus a real ChatGPT session, so they
          # only run on a developer machine with `codex-bridge start` up.
          # CI covers the same code paths with smoke.mjs against the real API.
          echo "tool tests skipped on CI; covered by smoke.mjs against the real API."

  smoke:
    # Live integration test against the real ChatGPT Responses API.
    # This job runs on schedule and on push to main. It is gated on
    # the CODEX_AUTH_JSON secret being set; if it is not, we skip
    # silently so a private repo without the secret can still build.
    #
    # SECURITY: the secret must contain a fresh auth.json from
    # `codex login`. Whoever can read this secret can use the
    # account. Rotate the access_token in the secret at least every
    # 90 days, and never paste the raw auth.json into a public place.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Run live smoke test
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          if [ -z "$CODEX_AUTH_JSON" ]; then
            echo "::warning::CODEX_AUTH_JSON secret not set; skipping live smoke."
            exit 0
          fi
          mkdir -p ~/.codex
          printf '%s' "$CODEX_AUTH_JSON" > ~/.codex/auth.json
          chmod 600 ~/.codex/auth.json
          node test/smoke.mjs

  publish:
    needs: [test]
    if: github.event_name != 'pull_request' && github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    # Trusted publishing: actions/setup-node with registry-url exchanges
    # the GitHub OIDC token for a short-lived npm token at runtime.
    # The trusted publisher is configured on the package itself
    # (https://www.npmjs.com/package/@jaralabs/codex-bridge -> Settings
    # -> Trusted Publishers -> jaralabs/codex-bridge / publish.yml),
    # so no NPM_TOKEN secret is required.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci || npm install

      - name: Type-check the plugin
        run: npx --yes -p typescript@5 tsc --noEmit --target es2022 --module esnext --moduleResolution bundler --strict --skipLibCheck --types node lib/plugin.ts

      - name: Smoke test the package builds
        run: node --check lib/server.mjs && node --check lib/tools-registry.mjs && node --check lib/auth.mjs && node --check lib/resilience.mjs && node --check lib/capabilities.mjs

      - name: Dry-run on pull requests
        if: github.event_name == 'pull_request'
        run: npm publish --dry-run

      - name: Publish on main when the version moved
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: publish
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view "$PACKAGE_NAME" version 2>/dev/null || echo "0.0.0")
          echo "current=$CURRENT_VERSION published=$PUBLISHED_VERSION"
          if [ "$CURRENT_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "::notice::Version unchanged; skipping publish."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          npm publish
